name: ci

on:
  push:
    branches: [master]
  pull_request:
    # A generated release pull request changes only the version strings and the
    # changelog. release-please opens it with GITHUB_TOKEN, and GitHub does not
    # run workflows for those, so a run would sit in `action_required` forever.
    # Ignoring those paths means no run is created at all. A normal pull request
    # still runs, because it always touches something outside this list, and the
    # push to master always runs.
    paths-ignore:
      - "CHANGELOG.md"
      - ".release-please-manifest.json"
      - "package.json"
      - "apps/desktop/package.json"
      - "apps/desktop/src-tauri/tauri.conf.json"
      - "apps/desktop/src-tauri/Cargo.toml"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: commits (every commit must be releasable)
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release-please only bumps for the commit types it understands, so a
      # metadata-only commit would land with no version change. The rule here is
      # "every commit is a patch, only a breaking change is a minor", and this
      # step is what makes that rule true rather than hoped for.
      - name: Check the commit range
        env:
          BEFORE: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            range_start="$BASE_SHA"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            range_start="$BEFORE"
          else
            # A brand-new branch: compare against the default branch instead.
            range_start="$(git merge-base HEAD origin/master || git rev-list --max-parents=0 HEAD | tail -1)"
          fi
          ./scripts/check-commits.sh "$range_start" HEAD

  engine:
    # Skip the generated release PR: it only changes version
    # strings and the changelog. GitHub does not run workflows for
    # pull requests opened by GITHUB_TOKEN, so these runs land in
    # action_required and then show as a red failure with zero jobs.
    # The real check happens on the push to master after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: engine (tests, types, frozen files)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Needed for the frozen-file check below to have a base to diff against.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run typecheck

      - name: Test
        run: bun run test

      - name: Build the engine binary
        run: bun run build

      - name: The frozen engine files are untouched
        run: |
          if [ -n "$(git status --porcelain src/xfer src/index src/plan src/scan)" ]; then
            echo "::error::The acceptance gate says these files never change. Revert the staged changes."
            git status --porcelain src/xfer src/index src/plan src/scan
            exit 1
          fi
          echo "Frozen files untouched."

  desktop:
    # Skip the generated release PR: it only changes version
    # strings and the changelog. GitHub does not run workflows for
    # pull requests opened by GITHUB_TOKEN, so these runs land in
    # action_required and then show as a red failure with zero jobs.
    # The real check happens on the push to master after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: desktop (types, tests, AAA contrast)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: bun run check

      - name: Test
        run: bun run test

      - name: AAA contrast
        run: bun run a11y

      - name: Build the SPA
        run: bun run build

  rust:
    # Skip the generated release PR: it only changes version
    # strings and the changelog. GitHub does not run workflows for
    # pull requests opened by GITHUB_TOKEN, so these runs land in
    # action_required and then show as a red failure with zero jobs.
    # The real check happens on the push to master after the merge.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: rust (fmt, clippy, tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop/src-tauri
    steps:
      - uses: actions/checkout@v4

      # tauri-build and the tauri crate link against webkit2gtk-4.1, and clippy
      # and the tests both compile the crate, so the same libraries the bundle
      # job installs are needed here.
      - name: System libraries for Tauri
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      # tauri-build copies the sidecar named in `externalBin` at compile time and
      # fails if it is missing. This job only compiles and unit-tests the shell,
      # so a placeholder is enough; the real binary is built by `bun run sidecar`
      # in the bundle job.
      - name: Provide the sidecar placeholder
        working-directory: .
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/portage-$(rustc --print host-tuple)"

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
