name: release-desktop

# Builds the installable desktop app. Two paths:
#   1. any pull request touching the app or the engine -> a downloadable artifact,
#      so a build can be tested before anything is merged;
#   2. a published release -> the .deb and .AppImage attached to that release.

# Called by release-please.yml in the same run, because a release created with
# the built-in token does not trigger the `release` event and a second workflow
# would never start. Also runs on a pull request, so a build can be tried before
# anything is merged.
on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Tag to attach the installers to. Empty means do not attach.
        required: false
        type: string
        default: ""

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: bundle (deb, appimage)
    # The generated release PR changes version strings only, and GitHub does not
    # run workflows for pull requests opened by GITHUB_TOKEN, so a run here lands
    # in action_required and then shows as a red failure with no jobs. The real
    # build happens on the push to master, and again for the release itself.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Tauri's Linux dependencies. webkit2gtk-4.1 is what Tauri v2 links
      # against; the 4.0 package will not satisfy it.
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install engine dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # Builds dist/portage, then copies it to src-tauri/binaries with the
      # target triple Tauri appends at bundle time.
      - name: Stage the engine sidecar
        working-directory: apps/desktop
        run: bun run sidecar

      - name: Bundle the app
        working-directory: apps/desktop
        run: bun x tauri build --bundles deb,appimage

      - name: Record what was built
        run: |
          {
            echo "### Desktop bundle"
            echo ""
            find apps/desktop/src-tauri/target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.AppImage' \) \
              -exec du -h {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: portage-desktop-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Attach to the release
        if: ${{ inputs.tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          files: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
