name: release-desktop

# Builds the installable desktop app. Two paths:
#   1. any pull request touching the app or the engine -> a downloadable artifact,
#      so a build can be tested before anything is merged;
#   2. called by release-please.yml when a release is owed -> the same artifacts,
#      which that workflow attaches to the tag it then creates.
#
# It never tags or releases anything itself, so a release cannot exist before
# its installers do.

on:
  pull_request:
    paths:
      - "apps/desktop/**"
      - "src/**"
      - "scripts/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:
  workflow_call:

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    # The generated release PR changes only version strings and the changelog,
    # and GitHub opens it with GITHUB_TOKEN. Workflows do not run for those, so
    # a pull_request run here would sit in action_required with zero jobs and
    # show as a red failure. The real bundle is built through workflow_call
    # after the merge; a normal pull request still runs this job.
    if: ${{ !startsWith(github.head_ref, 'release-please--') }}
    name: bundle (deb, appimage)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.4"

      # Tauri's Linux dependencies. webkit2gtk-4.1 is what Tauri v2 links
      # against; the 4.0 package will not satisfy it.
      #
      # libfuse2, patchelf and zsync are what the AppImage step needs and the
      # runner image does not guarantee. linuxdeploy and appimagetool are
      # themselves AppImages: without FUSE they exit before printing anything,
      # and the bundler reports only "failed to run linuxdeploy", which is all
      # the 0.1.8 run had to go on.
      - name: System libraries for Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libfuse2 \
            patchelf \
            zsync \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install engine dependencies
        run: bun install --frozen-lockfile

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: bun install --frozen-lockfile

      # `beforeBuildCommand` builds the SPA and stages the engine sidecar
      # (`bun run build && bun run sidecar`), so `tauri build` is self-contained
      # and this job needs no separate staging step.
      #
      # `-v` keeps linuxdeploy's own output in the log. Without it a failure
      # arrives as the four words "failed to run linuxdeploy" and nothing else.
      #
      # APPIMAGE_EXTRACT_AND_RUN makes those tools unpack and run instead of
      # mounting through FUSE, which is the fragile part inside a container.
      - name: Bundle the app
        working-directory: apps/desktop
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: bun x tauri build --bundles deb,appimage -v

      - name: Record what was built
        run: |
          {
            echo "### Desktop bundle"
            echo ""
            find apps/desktop/src-tauri/target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.AppImage' \) \
              -exec du -h {} \; | sort
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the installers
        uses: actions/upload-artifact@v4
        with:
          name: portage-desktop-${{ github.sha }}
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
