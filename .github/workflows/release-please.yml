name: release-please

on:
  push:
    branches: [master]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # The tag this run published, or empty when there was nothing to tag.
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      # While the version is 0.x this does what was asked for:
      #   bump-minor-pre-major + bump-patch-for-minor-pre-major
      # Every commit bumps a PATCH and only a breaking change (a `!` in the type,
      # or a BREAKING CHANGE footer) bumps a MINOR. Neither reaches 1.0.0, so no
      # release here is ever a major. See release-please-config.json.
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ github.token }}

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # release-please maintains the version, the changelog and the release PR.
      # Its own tagging step matches a merged release PR by parsing the PR title,
      # which manifest mode never writes a version into, so it aborts with
      # "untagged merged release PRs outstanding" and no tag is ever created.
      #
      # Rather than depend on that internal, this closes the loop from the one
      # thing that is always true after a release PR merges: package.json holds
      # the new version. If there is no tag for it, tag it and publish the notes.
      - name: Tag the merged version when it has no tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(python3 -c "import json;print(json.load(open('package.json'))['version'])")"
          tag="v${version}"
          echo "package.json says $tag"

          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "${tag} already exists; nothing to tag."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh release view "${tag}" >/dev/null 2>&1; then
            echo "${tag} already has a release; nothing to do."
            echo "tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The notes are the changelog section release-please just wrote.
          python3 - "$version" > /tmp/notes.md <<'PY'
          import re, sys
          version, = sys.argv[1:]
          text = open('CHANGELOG.md').read()
          pattern = rf'(## \[{re.escape(version)}\].*?)(?=\n## \[|\Z)'
          found = re.search(pattern, text, re.S)
          print(found.group(1).strip() if found else f'Release {version}.')
          PY

          # An annotated tag needs a committer, and a fresh runner has none.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git tag -a "${tag}" -m "${tag}"
          git push origin "${tag}"
          gh release create "${tag}" --title "${tag}" --notes-file /tmp/notes.md
          echo "Published ${tag}. The desktop bundle attaches to it next."
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # release-please treats a merged release PR still labelled `pending` as an
      # unreleased version, and refuses to propose the next one while it sees
      # that. Our tag now exists, so move the label to match reality.
      - name: Mark merged release pull requests as tagged
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          merged="$(gh pr list --state merged --label "autorelease: pending" \
            --json number --jq '.[].number')"
          if [ -z "$merged" ]; then
            echo "Nothing left pending."
            exit 0
          fi
          for pr in $merged; do
            gh pr edit "$pr" --remove-label "autorelease: pending" \
              --add-label "autorelease: tagged" >/dev/null
            echo "Marked #${pr} as tagged."
          done

      # The repo setting `delete_branch_on_merge` already handles this, and it is
      # the thing to rely on. This step is the belt to that braces: a release
      # branch that merged while the setting was off (or that was merged by an
      # integration which ignores it) would otherwise sit in the branch list
      # forever. Deleting a stray branch is safe because release-please recreates
      # it the next time it needs a release PR.
      - name: Delete stale release branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for branch in $(git ls-remote --heads origin \
            'refs/heads/release-please--*' | awk '{print $2}' | sed 's|refs/heads/||'); do
            # Keep it if an open pull request still uses it.
            if [ -n "$(gh pr list --state open --head "$branch" --json number --jq '.[].number')" ]; then
              echo "${branch} still has an open pull request; keeping it."
              continue
            fi
            gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}" >/dev/null
            echo "Deleted merged branch ${branch}."
          done

  # Runs in the same workflow run, so it is not blocked by the rule that
  # events caused by the built-in token do not start other workflows.
  bundle:
    needs: release-please
    if: ${{ needs.release-please.outputs.tag != '' }}
    permissions:
      contents: write
    uses: ./.github/workflows/release-desktop.yml
    with:
      tag: ${{ needs.release-please.outputs.tag }}
